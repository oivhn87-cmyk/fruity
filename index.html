<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8番出口 - オンラインマルチプレイ版</title>
    <!-- PeerJS（オンラインリアルタイム通信用ライブラリ） -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        #game-container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { font-size: 20px; margin: 5px 0; }
        #status { font-size: 16px; margin: 5px 0 10px 0; color: #f39c12; }
        
        #online-box {
            background: #222;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        #share-url {
            width: 80%;
            padding: 4px;
            background: #000;
            color: #0f0;
            border: 1px solid #555;
            text-align: center;
        }

        canvas {
            border: 2px solid #555;
            background-color: #000;
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 5 / 3;
            border-radius: 8px;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        button {
            flex: 1;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            background-color: #333;
            color: white;
            border: 2px solid #666;
            border-radius: 8px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        button.active {
            background-color: #f39c12;
            color: #000;
            border-color: #fff;
        }
        button:active { transform: scale(0.96); }
        .copy-btn {
            padding: 4px 8px;
            font-size: 12px;
            margin-left: 5px;
            background: #444;
            border: 1px solid #777;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>8番出口 - Online Multiplayer</h1>
    
    <!-- オンライン接続パネル -->
    <div id="online-box">
        <span id="network-status">🌐 サーバー接続中...</span><br>
        <div id="link-area" style="display:none; margin-top:5px;">
            招待URL: <input type="text" id="share-url" readonly>
            <button class="copy-btn" onclick="copyLink()">コピー</button>
        </div>
        <div id="player-count">オンライン人数: 1人</div>
    </div>

    <div id="status">現在の地下通路: 0番出口</div>
    
    <canvas id="gameCanvas" width="500" height="300"></canvas>

    <div class="controls">
        <div class="btn-row">
            <button id="btn-look-left">◀ 左を見る</button>
            <button id="btn-look-center" class="active">正面</button>
            <button id="btn-look-right">右を見る ▶</button>
        </div>
        <div class="btn-row">
            <button id="btn-forward">▲ 前に進む</button>
            <button id="btn-back">▼ 引き返す</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");

    let exitNumber = 0;
    let hasAnomaly = false;
    let anomalyType = 0;

    // プレイヤーの自分の位置
    let myZ = 0.1;
    let viewAngle = "center";
    let isMovingForward = false;
    let isMovingBack = false;

    // 他のプレイヤーの情報 { id: { z, angle, color } }
    const otherPlayers = {};

    // ネットワーク関係 (PeerJS)
    let peer = null;
    let connections = [];
    let myId = "";
    let myColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 60%)`; // ランダムな服の色

    // --- オンラインマルチ機能 ---
    function initNetwork() {
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('room');

        peer = new Peer();

        peer.on('open', (id) => {
            myId = id;
            document.getElementById('network-status').textContent = "🌐 オンライン接続完了！";
            document.getElementById('link-area').style.display = "block";

            // 招待URLの生成
            const shareUrl = window.location.origin + window.location.pathname + '?room=' + (hostId || id);
            document.getElementById('share-url').value = shareUrl;

            // ホスト（部屋作成者）ではない場合、ホストに接続
            if (hostId && hostId !== id) {
                connectToPeer(hostId);
            }
        });

        // 他のプレイヤーからの接続を受け取る
        peer.on('connection', (conn) => {
            setupConnection(conn);
        });
    }

    function connectToPeer(targetId) {
        const conn = peer.connect(targetId);
        setupConnection(conn);
    }

    function setupConnection(conn) {
        conn.on('open', () => {
            connections.push(conn);
            updatePlayerCount();

            // 定期的に自分の位置データを送信 (20FPS)
            setInterval(() => {
                conn.send({
                    type: 'position',
                    id: myId,
                    z: myZ,
                    angle: viewAngle,
                    color: myColor
                });
            }, 50);
        });

        conn.on('data', (data) => {
            if (data.type === 'position') {
                otherPlayers[data.id] = {
                    z: data.z,
                    angle: data.angle,
                    color: data.color
                };
            }
        });

        conn.on('close', () => {
            delete otherPlayers[conn.peer];
            connections = connections.filter(c => c !== conn);
            updatePlayerCount();
        });
    }

    function updatePlayerCount() {
        const count = Object.keys(otherPlayers).length + 1;
        document.getElementById('player-count').textContent = `オンライン人数: ${count}人`;
    }

    function copyLink() {
        const copyText = document.getElementById("share-url");
        copyText.select();
        document.execCommand("copy");
        alert("招待リンクをコピーしました！友達に送信してください。");
    }

    // --- ゲーム本体の処理 ---
    function init() {
        document.getElementById("btn-look-left").onclick = () => setView("left");
        document.getElementById("btn-look-center").onclick = () => setView("center");
        document.getElementById("btn-look-right").onclick = () => setView("right");

        bindHoldButton("btn-forward", (v) => isMovingForward = v);
        bindHoldButton("btn-back", (v) => isMovingBack = v);

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") isMovingForward = true;
            if (e.key === "ArrowDown" || e.key === "s") isMovingBack = true;
            if (e.key === "ArrowLeft" || e.key === "a") setView("left");
            if (e.key === "ArrowRight" || e.key === "d") setView("right");
        });
        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") isMovingForward = false;
            if (e.key === "ArrowDown" || e.key === "s") isMovingBack = false;
        });

        initNetwork();
        nextCorridor();
        requestAnimationFrame(gameLoop);
    }

    function setView(angle) {
        viewAngle = angle;
        document.getElementById("btn-look-left").classList.toggle("active", angle === "left");
        document.getElementById("btn-look-center").classList.toggle("active", angle === "center");
        document.getElementById("btn-look-right").classList.toggle("active", angle === "right");
    }

    function bindHoldButton(id, callback) {
        const btn = document.getElementById(id);
        btn.addEventListener("pointerdown", (e) => { e.preventDefault(); callback(true); });
        btn.addEventListener("pointerup", (e) => { e.preventDefault(); callback(false); });
        btn.addEventListener("pointerleave", (e) => { e.preventDefault(); callback(false); });
    }

    function nextCorridor() {
        myZ = 0.1;
        setView("center");

        if (exitNumber === 0) {
            hasAnomaly = false;
        } else {
            hasAnomaly = Math.random() < 0.5;
            anomalyType = Math.floor(Math.random() * 3);
        }

        updateStatus();
    }

    function gameLoop() {
        if (isMovingForward) myZ += 0.007;
        if (isMovingBack) myZ -= 0.007;

        if (myZ >= 0.95) {
            checkChoice('forward');
        } else if (myZ <= -0.05) {
            checkChoice('back');
        }

        drawScene();
        requestAnimationFrame(gameLoop);
    }

    function checkChoice(action) {
        let isCorrect = (action === 'forward' && !hasAnomaly) || (action === 'back' && hasAnomaly);

        if (isCorrect) {
            exitNumber++;
            if (exitNumber === 8) {
                alert("🎉 脱出成功！\n8番出口から無事に外へ出られました！");
                exitNumber = 0;
            }
        } else {
            alert("❌ 異変失敗...\n0番出口に戻されてしまった。");
            exitNumber = 0;
        }
        nextCorridor();
    }

    function updateStatus() {
        statusText.textContent = `現在の地下通路: ${exitNumber}番出口`;
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#1b1b1b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (viewAngle === "center") {
            drawCenterView();
        } else if (viewAngle === "left") {
            drawLeftWallView();
        } else if (viewAngle === "right") {
            drawRightWallView();
        }
    }

    function drawCenterView() {
        const zoom = 1 + myZ * 1.5;
        const cx = 250, cy = 150;
        const nw = 200 / zoom, nh = 140 / zoom;

        // 床・天井
        ctx.fillStyle = "#2a2a2a";
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(cx - nw, cy - nh); ctx.lineTo(cx + nw, cy - nh); ctx.lineTo(500, 0); ctx.fill();

        ctx.fillStyle = "#121212";
        ctx.beginPath();
        ctx.moveTo(0, 300); ctx.lineTo(cx - nw, cy + nh); ctx.lineTo(cx + nw, cy + nh); ctx.lineTo(500, 300); ctx.fill();

        // 奥の壁
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(cx - nw, cy - nh, nw * 2, nh * 2);

        // 黄色い標識
        ctx.fillStyle = "#e6c200";
        ctx.fillRect(cx - 50 / zoom, cy - nh + 10 / zoom, 100 / zoom, 25 / zoom);
        ctx.fillStyle = "#000";
        ctx.font = `bold ${Math.max(10, 14 / zoom)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(`地下通路 8`, cx, cy - nh + 27 / zoom);

        // オンラインの「他のプレイヤー」を描画
        drawOtherPlayers();
    }

    // 他のプレイヤーを画面内に描画する処理
    function drawOtherPlayers() {
        for (const id in otherPlayers) {
            const player = otherPlayers[id];
            
            // 正面を向いているプレイヤーのみ視界に表示
            if (player.angle !== "center") continue;

            const relZ = player.z - myZ;
            if (relZ <= 0.05 || relZ > 1.2) continue; // 画面外なら非表示

            ctx.save();
            const scale = (1 / relZ) * 0.25;
            const y = 150 + (60 / relZ);

            ctx.translate(250, y);
            ctx.scale(scale, scale);

            // 他プレイヤーの服・体
            ctx.fillStyle = player.color || "#3498db";
            ctx.fillRect(-12, -45, 24, 30);
            ctx.fillStyle = "#222";
            ctx.fillRect(-10, -15, 8, 25);
            ctx.fillRect(2, -15, 8, 25);

            // 頭
            ctx.fillStyle = "#ffcc99";
            ctx.beginPath(); ctx.arc(0, -55, 10, 0, Math.PI * 2); ctx.fill();

            // 「P2（他の人）」などのアイコン
            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PLAYER", 0, -70);

            ctx.restore();
        }
    }

    function drawLeftWallView() {
        ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const posterX = 180 + (myZ - 0.5) * 200;

        ctx.fillStyle = "#fff"; ctx.fillRect(posterX - 65, 65, 130, 170);

        if (hasAnomaly && anomalyType === 0) {
            ctx.fillStyle = "#800000"; ctx.fillRect(posterX - 60, 70, 120, 160);
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(posterX, 130, 30, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = "#3498db"; ctx.fillRect(posterX - 60, 70, 120, 160);
        }
    }

    function drawRightWallView() {
        ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const signX = 250 - (myZ - 0.5) * 200;

        ctx.fillStyle = "#00a854"; ctx.fillRect(signX - 70, 80, 140, 90);
    }

    init();
</script>

</body>
</html>
